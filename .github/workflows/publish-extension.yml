name: Build and publish extension

on:
  push:
    branches: [main]
    paths:
      - ".github/extensions/agent-review/**"
      - ".github/plugin/**"
      - ".github/workflows/publish-extension.yml"
      - "scripts/**"
      - "LICENSE"
  pull_request:
    paths:
      - ".github/extensions/agent-review/**"
      - ".github/plugin/**"
      - ".github/workflows/publish-extension.yml"
      - "scripts/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli-discovery:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check app-managed Copilot discovery
        run: >-
          node --test
          .github/extensions/agent-review/tests/test-managed-copilot.mjs
          .github/extensions/agent-review/tests/test-historical-sessions.mjs
          .github/extensions/agent-review/tests/test-ai-explainer.mjs
          .github/extensions/agent-review/tests/test-annotation-context.mjs
          .github/extensions/agent-review/tests/test-review-state.mjs
          .github/extensions/agent-review/tests/test-review-progress.mjs
          .github/extensions/agent-review/tests/test-review-handoff.mjs
      - name: Check isolated runtime preparation
        run: node --test .github/extensions/agent-review/tests/test-managed-runtimes.mjs .github/extensions/agent-review/tests/test-node-runtime.mjs
      - name: Verify runtime downloads without installed prerequisites
        run: node scripts/verify-managed-runtimes.mjs

  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Check packaging and runtime routing
        run: node --test .github/extensions/agent-review/tests/test-distribution.mjs .github/extensions/agent-review/tests/test-bootstrap.mjs .github/extensions/agent-review/tests/test-python-runtime.mjs .github/extensions/agent-review/tests/test-publish-workflow.mjs
      - name: Check review evidence budgets and repository rules
        run: node --test .github/extensions/agent-review/tests/test-custom-analysis.mjs .github/extensions/agent-review/tests/test-review-contracts.mjs .github/extensions/agent-review/tests/test-review-pipeline.mjs .github/extensions/agent-review/tests/test-impact-model.mjs .github/extensions/agent-review/tests/test-item-discussion.mjs .github/extensions/agent-review/tests/test-review-sections.mjs
      - name: Check saved snapshots and oversized diffs
        run: python -m unittest discover -s .github/extensions/agent-review/tests -p test_snapshot.py
      - name: Check cross-platform session paths and attribution
        run: node --test .github/extensions/agent-review/tests/test-session-context.mjs
      - name: Check source navigation and snapshot caching
        run: node --test .github/extensions/agent-review/tests/test-diff-context.mjs .github/extensions/agent-review/tests/test-source-performance.mjs .github/extensions/agent-review/tests/test-review-location.mjs .github/extensions/agent-review/tests/test-review-presentation.mjs .github/extensions/agent-review/tests/test-review-workspace.mjs .github/extensions/agent-review/tests/test-change-relations.mjs .github/extensions/agent-review/tests/test-layer-summaries.mjs
      - name: Build prepared extension
        run: node scripts/build-distribution.mjs "${{ runner.temp }}/agent-review-dist"
      - name: Verify bundled analyzers
        run: node scripts/verify-distribution.mjs "${{ runner.temp }}/agent-review-dist"
      - name: Package release ZIP and native plugin with folder-import loader
        run: node scripts/build-release-distribution.mjs "${{ runner.temp }}/agent-review-dist" "${{ runner.temp }}/agent-review-release"
      - name: Verify plugin discovery, first-run extraction, and offline reuse
        run: node scripts/verify-release-distribution.mjs "${{ runner.temp }}/agent-review-release"
      - name: Save distribution
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-review-dist
          path: ${{ runner.temp }}/agent-review-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, cli-discovery]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-review-dist
          path: ${{ runner.temp }}/agent-review-release
      - name: Publish pinned release and generated plugin branch
        shell: bash
        env:
          RELEASE_ROOT: ${{ runner.temp }}/agent-review-release
          DIST_ROOT: ${{ runner.temp }}/agent-review-published
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="agent-review-${SOURCE_SHA}"
          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release download "$tag" --repo "$REPOSITORY" \
              --pattern agent-review.zip --pattern release-manifest.json \
              --dir "$RELEASE_ROOT" --clobber
          else
            gh release create "$tag" --repo "$REPOSITORY" --target "$SOURCE_SHA" \
              --title "Agent Review ${SOURCE_SHA:0:12}" --prerelease \
              --notes "Prepared extension bundle. The dist loader verifies the ZIP's pinned SHA-256 before extraction and prepares private Node.js 24+, Python 3.14+, and .NET 10 runtimes when they are not installed." \
              "$RELEASE_ROOT/agent-review.zip" "$RELEASE_ROOT/release-manifest.json"
          fi
          node scripts/build-release-distribution.mjs --bootstrap-from \
            "$RELEASE_ROOT/release-manifest.json" "$DIST_ROOT"
          cd "$DIST_ROOT"
          git init --initial-branch=dist
          git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          git config --local "credential.${SERVER_URL}.helper" ""
          git config --local --add "credential.${SERVER_URL}.helper" '!gh auth git-credential'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          existing="$(git ls-remote origin refs/heads/dist)"
          if [ -n "$existing" ]; then
            git fetch --depth=1 origin refs/heads/dist
            git update-ref refs/heads/dist FETCH_HEAD
          fi
          git add --all --force
          if ! git diff --cached --quiet; then
            git commit -m "Build Agent Review from ${SOURCE_SHA}"
            git push origin HEAD:refs/heads/dist
          fi
